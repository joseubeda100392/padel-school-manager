<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3050"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05dca8"/>
      <stop offset="100%" stop-color="#00a87c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Racket head (pill shape — distinctive padel profile) -->
  <rect x="30" y="10" width="40" height="50" rx="18" fill="url(#gr)"/>

  <!-- Handle -->
  <rect x="42" y="57" width="16" height="26" rx="6" fill="url(#gr)"/>

  <!-- Hole grid on face -->
  <circle cx="43" cy="22" r="3"   fill="#0a1220" opacity="0.5"/>
  <circle cx="57" cy="22" r="3"   fill="#0a1220" opacity="0.5"/>
  <circle cx="37" cy="32" r="2.8" fill="#0a1220" opacity="0.5"/>
  <circle cx="50" cy="32" r="2.8" fill="#0a1220" opacity="0.5"/>
  <circle cx="63" cy="32" r="2.8" fill="#0a1220" opacity="0.5"/>
  <circle cx="37" cy="42" r="2.8" fill="#0a1220" opacity="0.5"/>
  <circle cx="50" cy="42" r="2.8" fill="#0a1220" opacity="0.5"/>
  <circle cx="63" cy="42" r="2.8" fill="#0a1220" opacity="0.5"/>
  <circle cx="43" cy="52" r="2.5" fill="#0a1220" opacity="0.5"/>
  <circle cx="57" cy="52" r="2.5" fill="#0a1220" opacity="0.5"/>

  <!-- Grip wrap lines on handle -->
  <rect x="42" y="63" width="16" height="2.5" rx="1" fill="#0a1220" opacity="0.4"/>
  <rect x="42" y="69" width="16" height="2.5" rx="1" fill="#0a1220" opacity="0.4"/>
  <rect x="42" y="75" width="16" height="2.5" rx="1" fill="#0a1220" opacity="0.4"/>
</svg>
