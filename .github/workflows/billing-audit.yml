name: Comprobación semanal de cobros

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  billing-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Call billing-audit
        run: |
          curl -sf -X POST "https://epadelschool.app/api/cron/billing-audit" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
